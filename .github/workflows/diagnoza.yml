name: Diagnoza startu

# Tymczasowy: zwykły start programu w warunkach zbliżonych do komputera użytkownika.
on:
  push:
    paths:
      - .github/workflows/diagnoza.yml

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publikacja
        run: dotnet publish src/PodpisPdf -c Release -r win-x64 -p:Platform=x64 -o publish
      - name: Starty w różnych warunkach
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Continue'
          $exe = Join-Path (Join-Path $env:USERPROFILE 'Downloads') 'PodpisPdf.exe'
          New-Item -ItemType Directory -Force (Split-Path $exe) | Out-Null
          Copy-Item publish/PodpisPdf.exe $exe
          function Start-Proba($nazwa) {
            Remove-Item "$env:TEMP/PodpisPdf-blad.txt" -ErrorAction SilentlyContinue
            $p = Start-Process $exe -PassThru
            Start-Sleep -Seconds 20
            $blad = Get-Content "$env:TEMP/PodpisPdf-blad.txt" -Raw -ErrorAction SilentlyContinue
            $dziala = -not $p.HasExited
            Get-Process PodpisPdf -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            if ($blad) { "::warning title=$nazwa::BŁĄD: $($blad -replace "`r?`n", ' | ')" }
            elseif ($dziala) { "::notice title=$nazwa::działa" }
            else { "::warning title=$nazwa::zakończył się bez pliku błędu (kod $($p.ExitCode))" }
          }

          Start-Proba '1 zwykły start z Pobranych'

          # Znacznik „pobrane z internetu” (Mark of the Web), jak po pobraniu przeglądarką.
          Set-Content -Path $exe -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3`r`nHostUrl=https://github.com/"
          Start-Proba '2 plik z Internetu (MOTW)'

          # Folder tymczasowy (wypakowane biblioteki) w profilu ze spacją.
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = 'C:\Users\Jan Kowalski\AppData\Local\Temp\.net'
          Start-Proba '3 profil ze spacją'

          # Polskie litery w ścieżce profilu.
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = 'C:\Users\Mateusz Kozielski Żółć\AppData\Local\Temp\.net'
          Start-Proba '4 profil z polskimi literami'

          # Program w folderze z polskimi literami i spacją.
          Remove-Item Env:DOTNET_BUNDLE_EXTRACT_BASE_DIR
          $exe2 = 'C:\Users\Mateusz Kozielski Żółć\Pobrane pliki\PodpisPdf.exe'
          New-Item -ItemType Directory -Force (Split-Path $exe2) | Out-Null
          Copy-Item publish/PodpisPdf.exe $exe2
          $exe = $exe2
          Start-Proba '5 program w folderze z polskimi literami'

          # Zmienna TEMP ze spacją i polskimi literami (bez DOTNET_BUNDLE_EXTRACT_BASE_DIR).
          $t = 'C:\Users\Mateusz Kozielski Żółć\Temp'
          New-Item -ItemType Directory -Force $t | Out-Null
          $env:TEMP = $t; $env:TMP = $t
          Start-Proba '6 TEMP z polskimi literami'
          exit 0
