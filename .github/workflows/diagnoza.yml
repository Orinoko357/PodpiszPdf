name: Diagnoza startu

# Tymczasowy: czy wersja 3.0.0.3 nie startuje, gdy w systemie jest Windows App Runtime.
on:
  push:
    paths:
      - .github/workflows/diagnoza.yml

permissions:
  contents: read

jobs:
  diagnoza:
    runs-on: windows-latest
    steps:
      - name: Wersja 3.0.0.3 z Windows App Runtime w systemie
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v3.0.0.3 -R ${{ github.repository }} -p PodpisPdf.exe -D stara
          function Start-Proba($nazwa) {
            Remove-Item "$env:TEMP/PodpisPdf-blad.txt" -ErrorAction SilentlyContinue
            $p = Start-Process stara/PodpisPdf.exe -PassThru
            Start-Sleep -Seconds 20
            $blad = Get-Content "$env:TEMP/PodpisPdf-blad.txt" -Raw -ErrorAction SilentlyContinue
            $dziala = -not $p.HasExited
            Get-Process PodpisPdf -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep -Seconds 2
            if ($blad) { "::warning title=$nazwa::BŁĄD: $($blad -replace "`r?`n", ' | ')" }
            elseif ($dziala) { "::notice title=$nazwa::działa" }
            else { "::warning title=$nazwa::zakończył się (kod $($p.ExitCode))" }
          }
          Start-Proba '3.0.0.3 bez Windows App Runtime'
          Invoke-WebRequest https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe -OutFile wasr.exe
          ./wasr.exe --quiet --force
          "::notice title=Runtime::$((Get-AppxPackage *WindowsAppRuntime*).PackageFullName -join ', ')"
          Start-Proba '3.0.0.3 z Windows App Runtime'
