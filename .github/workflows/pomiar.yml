name: Pomiar rozmiaru i startu

# Tymczasowy (pomiar): porównanie wariantów publikacji (rozmiar PodpisPdf.exe, pierwszy i kolejny start).
on:
  push:
    paths:
      - .github/workflows/pomiar.yml

jobs:
  skladniki:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Największe pliki publikacji (bez jednego pliku)
        shell: pwsh
        run: |
          dotnet publish src/PodpisPdf -c Release -r win-x64 -p:Platform=x64 -p:PublishSingleFile=false -o folder | Out-Null
          $razem = [math]::Round((Get-ChildItem folder -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)
          $lista = Get-ChildItem folder -Recurse -File | Sort-Object Length -Descending | Select-Object -First 45 |
            ForEach-Object { "{0:N1} MB {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path folder).Path.Length + 1) }
          "::notice title=Skladniki::Razem $razem MB; " + ($lista -join '; ')

  warianty:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nazwa: nowy (bez AI/ML/widżetów, przycinanie)
            parametry: ""
          - nazwa: bez przycinania
            parametry: -p:PublishTrimmed=false
    name: ${{ matrix.nazwa }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publikacja
        run: dotnet publish src/PodpisPdf -c Release -r win-x64 -p:Platform=x64 ${{ matrix.parametry }} -o publish
      - name: Pomiar
        shell: pwsh
        run: |
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP 'wypakowane'
          $wyniki = foreach ($proba in 1..4) {
            Remove-Item "$env:TEMP/PodpisPdf-blad.txt" -ErrorAction SilentlyContinue
            $czas = Measure-Command {
              $p = Start-Process publish/PodpisPdf.exe -ArgumentList '--sprawdz' -PassThru
              if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "brak zakończenia" }
            }
            if ($p.ExitCode -ne 0) {
              $blad = (Get-Content "$env:TEMP/PodpisPdf-blad.txt" -Raw -ErrorAction SilentlyContinue) -replace "\r?\n", ' | '
              "::error title=${{ matrix.nazwa }}::kod $($p.ExitCode): $blad"
              throw "kod $($p.ExitCode)"
            }
            [math]::Round($czas.TotalSeconds - 1.5, 2) # bez stałej pauzy 1,5 s w trybie --sprawdz
          }
          $rozmiar = [math]::Round((Get-Item publish/PodpisPdf.exe).Length / 1MB, 1)
          $wypak = if (Test-Path $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR) { [math]::Round((Get-ChildItem $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1) } else { 0 }
          "::notice title=Wynik::${{ matrix.nazwa }} | exe $rozmiar MB | wypakowane $wypak MB | start: pierwszy $($wyniki[0]) s, kolejne $($wyniki[1..3] -join ' / ') s"
      - name: Zrzuty ekranu (sprawdzenie interfejsu)
        shell: pwsh
        run: |
          $p = Start-Process publish/PodpisPdf.exe -ArgumentList '--zrzuty', "$PWD/zrzuty" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "brak zakończenia" }
          if ($p.ExitCode -ne 0) {
            $blad = (Get-Content "$env:TEMP/PodpisPdf-blad.txt" -Raw -ErrorAction SilentlyContinue) -replace "\r?\n", ' | '
            "::error title=Zrzuty ${{ matrix.nazwa }}::kod $($p.ExitCode): $blad"
            throw "kod $($p.ExitCode)"
          }
          "::notice title=Zrzuty::${{ matrix.nazwa }}: $((Get-ChildItem zrzuty/*.png).Count) zrzutów"
