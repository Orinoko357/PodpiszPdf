name: Pomiar rozmiaru i startu

# Tymczasowy: porównanie wariantów publikacji (rozmiar PodpisPdf.exe, pierwszy i kolejny start).
on:
  push:
    paths:
      - .github/workflows/pomiar.yml

jobs:
  skladniki:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Największe pliki publikacji (bez jednego pliku)
        shell: pwsh
        run: |
          dotnet publish src/PodpisPdf -c Release -r win-x64 -p:Platform=x64 -p:PublishSingleFile=false -o folder | Out-Null
          "Razem: $([math]::Round((Get-ChildItem folder -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)) MB, plików: $((Get-ChildItem folder -Recurse -File).Count)"
          Get-ChildItem folder -Recurse -File | Sort-Object Length -Descending | Select-Object -First 40 |
            ForEach-Object { "{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.FullName.Substring((Resolve-Path folder).Path.Length + 1) }

  warianty:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nazwa: obecny (R2R, kompresja, wszystko wypakowywane)
            parametry: ""
          - nazwa: bez kompresji
            parametry: -p:EnableCompressionInSingleFile=false
          - nazwa: bez ReadyToRun
            parametry: -p:PublishReadyToRun=false
          - nazwa: wypakowywane tylko biblioteki natywne
            parametry: -p:IncludeAllContentForSelfExtract=false -p:IncludeNativeLibrariesForSelfExtract=true
          - nazwa: tylko natywne, bez kompresji
            parametry: -p:IncludeAllContentForSelfExtract=false -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=false
    name: ${{ matrix.nazwa }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Publikacja
        run: dotnet publish src/PodpisPdf -c Release -r win-x64 -p:Platform=x64 ${{ matrix.parametry }} -o publish
      - name: Pomiar
        shell: pwsh
        run: |
          $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR = Join-Path $env:RUNNER_TEMP 'wypakowane'
          $wyniki = foreach ($proba in 1..4) {
            Remove-Item "$env:TEMP/PodpisPdf-blad.txt" -ErrorAction SilentlyContinue
            $czas = Measure-Command {
              $p = Start-Process publish/PodpisPdf.exe -ArgumentList '--sprawdz' -PassThru
              if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "brak zakończenia" }
            }
            if ($p.ExitCode -ne 0) { Get-Content "$env:TEMP/PodpisPdf-blad.txt" -ErrorAction SilentlyContinue; throw "kod $($p.ExitCode)" }
            [math]::Round($czas.TotalSeconds - 1.5, 2) # bez stałej pauzy 1,5 s w trybie --sprawdz
          }
          $rozmiar = [math]::Round((Get-Item publish/PodpisPdf.exe).Length / 1MB, 1)
          $wypak = if (Test-Path $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR) { [math]::Round((Get-ChildItem $env:DOTNET_BUNDLE_EXTRACT_BASE_DIR -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1) } else { 0 }
          "WYNIK | ${{ matrix.nazwa }} | exe $rozmiar MB | wypakowane $wypak MB | start: pierwszy $($wyniki[0]) s, kolejne $($wyniki[1..3] -join ' / ') s"
