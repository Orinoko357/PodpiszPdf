name: Build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      wersja:
        description: "Numer wydania do opublikowania, np. 1.0.0.1 (puste = tylko budowanie)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testy
        run: dotnet test tests/PodpisPdf.Tests -c Release

      - name: Publikacja PodpisPdf.exe
        run: dotnet publish src/PodpisPdf -c Release -r win-x64 -o publish

      - name: Test uruchomienia PodpisPdf.exe (i czas startu)
        shell: pwsh
        run: |
          foreach ($proba in 1..2) {
            $czas = Measure-Command {
              $p = Start-Process publish/PodpisPdf.exe -ArgumentList '--sprawdz' -Wait -PassThru
            }
            if ($p.ExitCode -ne 0) {
              Get-Content "$env:TEMP/PodpisPdf-sprawdz.txt" -ErrorAction SilentlyContinue
              throw "PodpisPdf.exe --sprawdz zakończył się kodem $($p.ExitCode)"
            }
            "Uruchomienie $proba`: $([math]::Round($czas.TotalSeconds, 2)) s"
          }
          "Rozmiar: $([math]::Round((Get-Item publish/PodpisPdf.exe).Length / 1MB, 1)) MB"

      - name: Zrzuty ekranu okien (jasny i ciemny motyw)
        shell: pwsh
        run: |
          $p = Start-Process publish/PodpisPdf.exe -ArgumentList '--zrzuty', "$PWD/zrzuty" -Wait -PassThru
          if (Test-Path zrzuty/blad.txt) { Get-Content zrzuty/blad.txt }
          if ($p.ExitCode -ne 0) { throw "Zrzuty ekranu: kod $($p.ExitCode)" }
          # Obrazy w logu (base64), żeby można je było obejrzeć bez pobierania artefaktu.
          foreach ($plik in Get-ChildItem zrzuty -Filter *.png | Sort-Object Name) {
            $b64 = [Convert]::ToBase64String([IO.File]::ReadAllBytes($plik.FullName))
            for ($i = 0; $i -lt $b64.Length; $i += 3000) {
              "ZRZUT $($plik.Name) " + $b64.Substring($i, [Math]::Min(3000, $b64.Length - $i))
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: Zrzuty-ekranu
          path: zrzuty/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: PodpisPdf
          path: publish/PodpisPdf.exe

      # Wydanie (Release) z plikiem PodpisPdf.exe: po wypchnięciu znacznika vX.Y.Z.W
      # albo po ręcznym uruchomieniu workflow z podanym numerem wersji (znacznik powstaje wtedy automatycznie).
      - name: Wydanie (Release)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.wersja != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.wersja != '' && format('v{0}', inputs.wersja) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PodpisPdf ${{ inputs.wersja != '' && format('v{0}', inputs.wersja) || github.ref_name }}
          files: publish/PodpisPdf.exe
          generate_release_notes: true
