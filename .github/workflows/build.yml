name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Testy
        run: dotnet test tests/PodpisPdf.Tests -c Release

      - name: Publikacja PodpisPdf.exe
        run: dotnet publish src/PodpisPdf -c Release -r win-x64 -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: PodpisPdf
          path: publish/PodpisPdf.exe

      # Znacznik vX.Y.Z.W → wydanie (Release) z plikiem PodpisPdf.exe do pobrania.
      - name: Wydanie (Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: PodpisPdf ${{ github.ref_name }}
          files: publish/PodpisPdf.exe
          generate_release_notes: true
