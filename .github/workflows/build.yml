name: Build

# Jeden przebieg na commit: wynik budowania z „push” jest widoczny także w pull requeście
# (osobny przebieg dla pull_request dublował maile o błędach).
# Nowa wersja (<Version> bez znacznika v<wersja>) jest po udanym budowaniu od razu wydawana (zadanie „wydanie”).
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      wersja: ${{ steps.wersja.outputs.wersja }}
      nowa: ${{ steps.wersja.outputs.nowa }}
    env:
      # Sekrety repozytorium (opcjonalne — bez nich program buduje się, ale bez pakietu menu Windows 11
      # i bez publikacji w repozytorium wydań, z którego program pobiera aktualizacje).
      CERTYFIKAT_PFX: ${{ secrets.CERTYFIKAT_PFX }}
    steps:
      - uses: actions/checkout@v7

      - name: Wersja i czy jest już wydana
        id: wersja
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wersja=$(grep -oP '(?<=<Version>)[^<]+' src/PodpiszPdf/PodpiszPdf.csproj)
          if gh api "repos/${{ github.repository }}/git/ref/tags/v$wersja" > /dev/null 2>&1; then nowa=nie; else nowa=tak; fi
          echo "Wersja $wersja, nowa: $nowa"
          echo "wersja=$wersja" >> "$GITHUB_OUTPUT"
          echo "nowa=$nowa" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Pakiety NuGet z poprzednich przebiegów (WinUI, Windows App SDK, iText) — bez pobierania od nowa.
      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      # --blame: przy awarii procesu testów pokazuje, który test był wtedy wykonywany.
      - name: Testy
        run: dotnet test tests/PodpiszPdf.Tests -c Release --blame

      # Pakiet „z zawartością zewnętrzną” dla nowego menu kontekstowego Windows 11, podpisany certyfikatem
      # CN=PodpisPdf (sekret CERTYFIKAT_PFX). Bez sekretu: certyfikat tymczasowy — pakiet tylko do testu
      # poniżej, nie trafia do PodpiszPdf.exe.
      - name: Pakiet menu Windows 11
        shell: pwsh
        run: |
          $wersja = ([xml](Get-Content src/PodpiszPdf/PodpiszPdf.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $bin = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).DirectoryName
          "Wersja pakietu: $wersja, narzędzia: $bin"
          New-Item -ItemType Directory -Force pakiet/budowa, pakiet/wynik | Out-Null
          Copy-Item pakiet/Assets pakiet/budowa -Recurse -Force
          (Get-Content pakiet/AppxManifest.xml -Raw).Replace('WERSJA', $wersja) | Set-Content pakiet/budowa/AppxManifest.xml -Encoding utf8
          & "$bin\makeappx.exe" pack /d pakiet/budowa /p pakiet/wynik/PodpiszPdf.msix /nv /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx: $LASTEXITCODE" }
          $haslo = 'PodpisPdf'
          if ($env:CERTYFIKAT_PFX) {
            [IO.File]::WriteAllBytes("$PWD/pakiet/cert.pfx", [Convert]::FromBase64String($env:CERTYFIKAT_PFX))
          } else {
            "::warning::Brak sekretu CERTYFIKAT_PFX — pakiet menu Windows 11 podpisany certyfikatem tymczasowym, tylko do testu."
            $c = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=PodpisPdf' -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable
            Export-PfxCertificate -Cert $c -FilePath pakiet/cert.pfx -Password (ConvertTo-SecureString $haslo -AsPlainText -Force) | Out-Null
          }
          & "$bin\signtool.exe" sign /fd SHA256 /f pakiet/cert.pfx /p $haslo pakiet/wynik/PodpiszPdf.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool: $LASTEXITCODE" }
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new("$PWD/pakiet/cert.pfx", $haslo)
          [IO.File]::WriteAllBytes("$PWD/pakiet/wynik/PodpiszPdf.cer", $cert.Export('Cert'))
          "Certyfikat: $($cert.Subject), odcisk $($cert.Thumbprint), ważny do $($cert.NotAfter)"
          Remove-Item pakiet/cert.pfx
          if (-not $env:CERTYFIKAT_PFX) { Move-Item pakiet/wynik pakiet/test }

      - name: Publikacja PodpiszPdf.exe
        run: dotnet publish src/PodpiszPdf -c Release -r win-x64 -p:Platform=x64 -o publish

      - name: Test uruchomienia PodpiszPdf.exe (i czas startu)
        shell: pwsh
        run: |
          foreach ($proba in 1..2) {
            $czas = Measure-Command {
              $p = Start-Process publish/PodpiszPdf.exe -ArgumentList '--sprawdz' -PassThru
              if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "PodpiszPdf.exe --sprawdz nie zakończył się w 3 minuty" }
            }
            if ($p.ExitCode -ne 0) {
              Get-Content "$env:TEMP/PodpiszPdf-blad.txt" -ErrorAction SilentlyContinue
              Get-WinEvent -LogName Application -MaxEvents 20 -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -match 'Application Error|\.NET Runtime' } | Format-List TimeCreated, Message
              throw "PodpiszPdf.exe --sprawdz zakończył się kodem $($p.ExitCode)"
            }
            "Uruchomienie $proba`: $([math]::Round($czas.TotalSeconds, 2)) s"
          }
          "Folder programu: $([math]::Round((Get-ChildItem publish -Recurse -File | Measure-Object Length -Sum).Sum / 1MB, 1)) MB"

      # Windows App Runtime zainstalowany w systemie (jak na wielu komputerach z Windows 11) — program musi
      # mimo to używać własnych bibliotek z pliku exe.
      - name: Instalacja Windows App Runtime (jak u użytkowników)
        shell: pwsh
        run: |
          Invoke-WebRequest https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe -OutFile "$env:RUNNER_TEMP/wasr.exe"
          & "$env:RUNNER_TEMP/wasr.exe" --quiet --force
          Get-AppxPackage *WindowsAppRuntime* | Select-Object -ExpandProperty PackageFullName

      # Zwykły start (jak u użytkownika: ikona w zasobniku, tło Mica, ustawienia, rejestr) — tryb --sprawdz
      # tego nie obejmuje. Program ma działać po 15 s i nie zapisać pliku błędu.
      - name: Test zwykłego startu PodpiszPdf.exe
        shell: pwsh
        run: |
          Remove-Item "$env:TEMP/PodpiszPdf-blad.txt" -ErrorAction SilentlyContinue
          $p = Start-Process publish/PodpiszPdf.exe -PassThru
          Start-Sleep -Seconds 15
          $blad = Get-Content "$env:TEMP/PodpiszPdf-blad.txt" -Raw -ErrorAction SilentlyContinue
          $dziala = -not $p.HasExited
          Get-Process PodpiszPdf -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($blad) { "::error title=Zwykły start::$($blad -replace "`r?`n", ' | ')"; throw "Błąd przy zwykłym starcie" }
          if (-not $dziala) { throw "Program zakończył się przy starcie (kod $($p.ExitCode))" }
          "Zwykły start: program działa"

      # Rejestracja pakietu z PodpiszPdf.exe w osobnym folderze (jak %APPDATA%\PodpiszPdf): start programu
      # z tożsamością pakietu i aktywacja serwera COM polecenia menu (tak robi to Eksplorator Windows 11).
      - name: Test pakietu menu Windows 11
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'PodpiszPdf-pakiet'
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item publish/* $folder -Recurse
          $zrodlo = if (Test-Path pakiet/wynik/PodpiszPdf.msix) { 'pakiet/wynik' } else { 'pakiet/test' }
          certutil -addstore TrustedPeople "$zrodlo/PodpiszPdf.cer" | Out-Null
          Add-AppxPackage -Path "$zrodlo/PodpiszPdf.msix" -ExternalLocation $folder
          Get-AppxPackage PodpiszPdf | Format-List Name, Version, PackageFullName
          Remove-Item "$env:TEMP/PodpiszPdf-sprawdz.txt" -ErrorAction SilentlyContinue
          $p = Start-Process "$folder/PodpiszPdf.exe" -ArgumentList '--sprawdz' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Start z folderu pakietu: brak zakończenia" }
          Get-Content "$env:TEMP/PodpiszPdf-sprawdz.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content "$env:TEMP/PodpiszPdf-blad.txt" -ErrorAction SilentlyContinue; throw "Start z folderu pakietu: kod $($p.ExitCode)" }
          $obiekt = [Activator]::CreateInstance([Type]::GetTypeFromCLSID([Guid]'6E2F4C3A-8B1D-4F5E-9A7C-2D3B4E5F6A71'))
          if ($null -eq $obiekt) { throw "Serwer COM menu nie odpowiada" }
          "Serwer COM menu Windows 11: działa"
          [Runtime.InteropServices.Marshal]::ReleaseComObject($obiekt) | Out-Null
          Get-Process PodpiszPdf -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-AppxPackage PodpiszPdf | Remove-AppxPackage
          # Certyfikat usuwamy, żeby test instalatora sprawdził, że to instalator go dodaje.
          $odcisk = ([Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path "$zrodlo/PodpiszPdf.cer").Path)).Thumbprint
          certutil -delstore TrustedPeople $odcisk | Out-Null

      - name: Zrzuty ekranu (jasny i ciemny motyw)
        shell: pwsh
        run: |
          Remove-Item "$env:TEMP/PodpiszPdf-blad.txt" -ErrorAction SilentlyContinue
          $p = Start-Process publish/PodpiszPdf.exe -ArgumentList '--zrzuty', "$PWD/zrzuty" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Zrzuty ekranu: brak zakończenia w 5 minut" }
          Get-Content "$env:TEMP/PodpiszPdf-blad.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Get-WinEvent -LogName Application -MaxEvents 20 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'Application Error|\.NET Runtime' } | Format-List TimeCreated, Message
            throw "Zrzuty ekranu: kod $($p.ExitCode)"
          }

      # Zrzuty na osobnej gałęzi „zrzuty-ekranu” (do obejrzenia bez pobierania artefaktu).
      - name: Zrzuty ekranu na gałąź zrzuty-ekranu
        shell: pwsh
        env:
          GALAZ: ${{ github.ref_name }} # przez zmienną, nie wklejane w skrypt
        run: |
          $zrodlo = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Force -Path ../zrzuty-galaz | Out-Null
          Copy-Item zrzuty/*.png ../zrzuty-galaz/
          Set-Location ../zrzuty-galaz
          git init -q -b zrzuty-ekranu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -q -m "Zrzuty ekranu z $zrodlo ($env:GALAZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" zrzuty-ekranu

      - uses: actions/upload-artifact@v6
        with:
          name: Zrzuty-ekranu
          path: zrzuty/*.png

      # Instalator MSI (WiX 5) z folderu programu. Wersja MSI ma trzy liczby: 3.1.0.2 → 3.1.2
      # (Windows porównuje przy aktualizacji tylko trzy pierwsze części numeru).
      - name: Instalator MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.Iis.wixext/5.0.2
          $v = [version](([xml](Get-Content src/PodpiszPdf/PodpiszPdf.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          $wersjaMsi = "$($v.Major).$($v.Minor).$($v.Build * 1000 + $v.Revision)"
          $cer = if (Test-Path pakiet/wynik/PodpiszPdf.cer) { 'pakiet/wynik/PodpiszPdf.cer' } else { 'pakiet/test/PodpiszPdf.cer' }
          New-Item -ItemType Directory -Force wynik | Out-Null
          wix build instalator/PodpiszPdf.wxs -arch x64 -ext WixToolset.Iis.wixext `
            -d Wersja=$wersjaMsi -d "Zrodlo=$((Resolve-Path publish).Path)" -d "Certyfikat=$((Resolve-Path $cer).Path)" -d "Ikona=$((Resolve-Path src/PodpiszPdf/PodpiszPdf.ico).Path)" `
            -o wynik/PodpiszPdf.msi
          if ($LASTEXITCODE -ne 0) { throw "wix build: $LASTEXITCODE" }
          "Instalator: $([math]::Round((Get-Item wynik/PodpiszPdf.msi).Length / 1MB, 1)) MB, wersja MSI $wersjaMsi"

      - name: Test instalatora (aktualizacja, start, menu, certyfikat, odinstalowanie)
        shell: pwsh
        env:
          # Zapytania API z tokenem — bez niego wspólny adres IP runnera wyczerpuje limit (błąd 403).
          GH_TOKEN: ${{ github.token }}
        run: |
          # Aktualizacja: najpierw opublikowane wydanie, na nie nowy instalator (gdy ma wyższy numer).
          $wersja = [version](([xml](Get-Content src/PodpiszPdf/PodpiszPdf.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          $najnowsze = Invoke-RestMethod https://api.github.com/repos/Orinoko357/PodpiszPdf-wydania/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $poprzednia = if ($najnowsze) { [version]($najnowsze.tag_name.TrimStart('v')) } else { $null }
          $testAktualizacji = $poprzednia -and $poprzednia -lt $wersja -and ($najnowsze.assets.name -contains 'PodpiszPdf.msi')
          if ($testAktualizacji) {
            Invoke-WebRequest ($najnowsze.assets | Where-Object name -eq 'PodpiszPdf.msi').browser_download_url -OutFile "$env:RUNNER_TEMP\poprzednia.msi"
            $p0 = Start-Process msiexec.exe -ArgumentList '/i', "`"$env:RUNNER_TEMP\poprzednia.msi`"", '/qn' -Wait -PassThru
            if ($p0.ExitCode -ne 0) { throw "Instalacja poprzedniej wersji ${poprzednia}: kod $($p0.ExitCode)" }
            "Zainstalowano poprzednią wersję $poprzednia"
          } else { "Bez testu aktualizacji (opublikowana: $poprzednia, budowana: $wersja)" }

          $p = Start-Process msiexec.exe -ArgumentList '/i', "`"$((Resolve-Path wynik/PodpiszPdf.msi).Path)`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\instalacja.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\instalacja.log" -Tail 60; throw "Instalacja MSI: kod $($p.ExitCode)" }
          $exe = Join-Path $env:ProgramFiles 'PodpiszPdf\PodpiszPdf.exe'
          if (-not (Test-Path $exe)) { throw "Brak $exe po instalacji" }
          $wersjaPliku = [version](Get-Item $exe).VersionInfo.FileVersion
          if ($wersjaPliku -ne $wersja) { throw "Zainstalowana wersja $wersjaPliku zamiast $wersja" }
          $wpisy = @(Get-ChildItem HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall | Get-ItemProperty | Where-Object DisplayName -eq 'PodpiszPdf')
          if ($wpisy.Count -ne 1) { throw "Wpisów PodpiszPdf w Aplikacjach: $($wpisy.Count) (oczekiwano 1)" }
          if ($testAktualizacji) { "Aktualizacja $poprzednia → ${wersja}: działa (jeden wpis w Aplikacjach)" }
          $cer = if (Test-Path pakiet/wynik/PodpiszPdf.cer) { 'pakiet/wynik/PodpiszPdf.cer' } else { 'pakiet/test/PodpiszPdf.cer' }
          $odcisk = ([Security.Cryptography.X509Certificates.X509Certificate2]::new((Resolve-Path $cer).Path)).Thumbprint
          if (-not (Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object Thumbprint -eq $odcisk)) { throw "Instalator nie dodał certyfikatu" }
          if (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('CommonPrograms')) 'PodpiszPdf.lnk'))) { throw "Brak skrótu w menu Start" }
          $s = Start-Process $exe -ArgumentList '--sprawdz' -PassThru
          if (-not $s.WaitForExit(180000)) { $s.Kill(); throw "Zainstalowany program: brak zakończenia" }
          if ($s.ExitCode -ne 0) {
            Get-Content "$env:TEMP/PodpiszPdf-blad.txt" -ErrorAction SilentlyContinue
            # Wyjątek sprzed obsługi błędów programu (np. brak biblioteki) — z dziennika zdarzeń Windows.
            Get-WinEvent -FilterHashtable @{ LogName = 'Application'; ProviderName = '.NET Runtime', 'Application Error'; StartTime = (Get-Date).AddMinutes(-5) } -ErrorAction SilentlyContinue |
              Select-Object -First 3 | ForEach-Object { $_.Message }
            "Tłumaczenia w zainstalowanym programie: $((Get-ChildItem (Split-Path $exe) -Recurse -Filter *.mui | ForEach-Object { $_.Directory.Name } | Sort-Object -Unique) -join ', ')"
            throw "Zainstalowany program: kod $($s.ExitCode)"
          }
          Get-Content "$env:TEMP/PodpiszPdf-sprawdz.txt" -ErrorAction SilentlyContinue
          Remove-Item "$env:TEMP/PodpiszPdf-blad.txt" -ErrorAction SilentlyContinue
          $z = Start-Process $exe -PassThru
          Start-Sleep -Seconds 15
          # Rejestracja pakietu menu odbywa się w tle po starcie — dajemy jej do 45 s.
          $koniec = (Get-Date).AddSeconds(30)
          while ($env:CERTYFIKAT_PFX -and -not (Get-AppxPackage PodpiszPdf) -and (Get-Date) -lt $koniec) { Start-Sleep -Seconds 3 }
          $blad = Get-Content "$env:TEMP/PodpiszPdf-blad.txt" -Raw -ErrorAction SilentlyContinue
          $dziala = -not $z.HasExited
          Get-Process PodpiszPdf -ErrorAction SilentlyContinue | Stop-Process -Force
          if ($blad) { "::error title=Zainstalowany program::$($blad -replace "`r?`n", ' | ')"; throw "Błąd zwykłego startu zainstalowanego programu" }
          if (-not $dziala) { throw "Zainstalowany program zakończył się przy starcie" }

          # Menu Windows 11: program sam rejestruje pakiet (certyfikat dodał instalator), serwer COM odpowiada.
          if ($env:CERTYFIKAT_PFX) {
            $pakiet = Get-AppxPackage PodpiszPdf
            if (-not $pakiet) { throw "Program nie zarejestrował pozycji w menu Windows 11" }
            "Menu Windows 11: pakiet $($pakiet.Version) zarejestrowany automatycznie"
            $obiekt = [Activator]::CreateInstance([Type]::GetTypeFromCLSID([Guid]'6E2F4C3A-8B1D-4F5E-9A7C-2D3B4E5F6A71'))
            if ($null -eq $obiekt) { throw "Serwer COM menu nie odpowiada" }
            [Runtime.InteropServices.Marshal]::ReleaseComObject($obiekt) | Out-Null
            Get-Process PodpiszPdf -ErrorAction SilentlyContinue | Stop-Process -Force
          }

          # Otwarcie PDF z ustawieniem „zawsze przeglądaj”: plik trafia do przeglądarki, program się kończy.
          $config = Join-Path $env:APPDATA 'PodpiszPdf\config.json'
          $ustawienia = if (Test-Path $config) { Get-Content $config -Raw | ConvertFrom-Json } else { New-Item -ItemType Directory -Force (Split-Path $config) | Out-Null; [pscustomobject]@{} }
          $ustawienia | Add-Member -NotePropertyName PoOtwarciuPdf -NotePropertyValue 'Przegladaj' -Force
          $ustawienia | ConvertTo-Json -Depth 5 | Set-Content $config -Encoding utf8
          $pdf = (Resolve-Path zrzuty/wniosek_o_dofinansowanie.pdf).Path
          $o = Start-Process $exe -ArgumentList '--otworz', "`"$pdf`"" -PassThru
          if (-not $o.WaitForExit(60000)) { $o.Kill(); throw "Otwarcie do przeglądania: program się nie zakończył" }
          if ($o.ExitCode -ne 0) { throw "Otwarcie do przeglądania: kod $($o.ExitCode)" }
          Start-Sleep -Seconds 5
          $przegladarka = Get-Process msedge, Acrobat, AcroRd32 -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $przegladarka) { throw "Plik PDF nie został otwarty w przeglądarce" }
          "Otwarcie PDF do przeglądania: $($przegladarka.ProcessName)"
          Get-Process msedge, Acrobat, AcroRd32 -ErrorAction SilentlyContinue | Stop-Process -Force

          Get-AppxPackage PodpiszPdf | Format-List Name, Version
          # Odinstalowanie samo usuwa pakiet menu i wpisy użytkownika (PodpiszPdf.exe --odinstaluj).
          $u = Start-Process msiexec.exe -ArgumentList '/x', "`"$((Resolve-Path wynik/PodpiszPdf.msi).Path)`"", '/qn' -Wait -PassThru
          if ($u.ExitCode -ne 0) { throw "Odinstalowanie: kod $($u.ExitCode)" }
          if (Test-Path $exe) { throw "Program został po odinstalowaniu" }
          if (Get-AppxPackage PodpiszPdf) { throw "Pakiet menu Windows 11 został po odinstalowaniu" }
          if (Test-Path 'HKCU:\Software\Classes\SystemFileAssociations\.pdf\shell\PodpiszPdf') { throw "Menu kontekstowe zostało po odinstalowaniu" }
          if (Get-ChildItem Cert:\LocalMachine\TrustedPeople | Where-Object Thumbprint -eq $odcisk) { throw "Certyfikat został po odinstalowaniu" }
          "Instalator: instalacja, start, certyfikat i odinstalowanie działają"

      - name: Suma kontrolna SHA-256
        shell: pwsh
        run: |
          $suma = (Get-FileHash wynik/PodpiszPdf.msi -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content wynik/PodpiszPdf.msi.sha256 "$suma  PodpiszPdf.msi" -NoNewline -Encoding ascii
          "SHA-256: $suma"

      # Gotowy, przetestowany instalator — z tego artefaktu korzysta zadanie „wydanie” (bez ponownej budowy).
      - uses: actions/upload-artifact@v6
        with:
          name: PodpiszPdf
          path: |
            wynik/PodpiszPdf.msi
            wynik/PodpiszPdf.msi.sha256
            pakiet/wynik/PodpiszPdf.cer
          if-no-files-found: error

  # PodpiszPdf dla macOS (Avalonia): testy logiki na macOS (PDFium, karta programowa SoftHSM), paczki .app
  # dla procesorów Apple i Intel w obrazach DMG, próbny podpis i start okna z zamontowanego obrazu, zrzuty ekranu.
  macos:
    runs-on: macos-latest
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Karta programowa do testów (SoftHSM)
        run: brew install softhsm

      - name: Testy na macOS
        run: dotnet test tests/PodpiszPdf.Tests -c Release --blame --results-directory "$PWD/wyniki-testow" --logger "console;verbosity=normal"

      # Przy awarii procesu testów: które testy były wtedy wykonywane (plik --blame).
      - name: Ostatnie testy przed awarią
        if: failure()
        run: find . /tmp "$TMPDIR" -name 'Sequence_*.xml' -exec tail -c 3000 {} \; 2>/dev/null || true

      - name: Publikacja i obrazy DMG
        id: dmg
        run: |
          wersja=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' src/PodpiszPdf/PodpiszPdf.csproj | head -1)
          echo "Wersja $wersja"
          mkdir -p wynik
          for para in "osx-arm64:AppleSilicon" "osx-x64:Intel"; do
            rid="${para%%:*}"; nazwa="${para##*:}"
            dotnet publish src/PodpiszPdf.Mac -c Release -r "$rid" -o "publikacja-$rid"
            instalator/macos/zbuduj-app.sh "publikacja-$rid" "$wersja" "wynik/PodpiszPdf-macOS-$nazwa.dmg"
          done
          for f in wynik/*.dmg; do shasum -a 256 "$f" | sed 's: wynik/:  :' > "$f.sha256"; done
          cat wynik/*.sha256

      # Jak u użytkownika: obraz zamontowany, program uruchomiony z niego (próbny podpis PAdES, podgląd PDFium, okno).
      - name: Test programu z obrazu DMG (Apple Silicon)
        run: |
          punkt=$(hdiutil attach -nobrowse -readonly wynik/PodpiszPdf-macOS-AppleSilicon.dmg | awk -F'\t' '/\/Volumes\//{print $NF}')
          app="$punkt/PodpiszPdf.app"
          codesign --verify --deep --strict "$app"
          rm -f "$TMPDIR/PodpiszPdf-blad.txt"
          if ! "$app/Contents/MacOS/PodpiszPdf" --sprawdz; then
            cat "$TMPDIR/PodpiszPdf-blad.txt" 2>/dev/null || true
            exit 1
          fi
          "$app/Contents/MacOS/PodpiszPdf" --zrzuty "$PWD/zrzuty-mac"
          ls zrzuty-mac
          hdiutil detach "$punkt"

      - name: Test wersji dla Intela (Rosetta)
        run: |
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then echo "Bez Rosetty na tym komputerze — pomijam."; exit 0; fi
          punkt=$(hdiutil attach -nobrowse -readonly wynik/PodpiszPdf-macOS-Intel.dmg | awk -F'\t' '/\/Volumes\//{print $NF}')
          arch -x86_64 "$punkt/PodpiszPdf.app/Contents/MacOS/PodpiszPdf" --sprawdz || { cat "$TMPDIR/PodpiszPdf-blad.txt" 2>/dev/null; exit 1; }
          hdiutil detach "$punkt"

      - uses: actions/upload-artifact@v6
        with:
          name: Zrzuty-ekranu-macOS
          path: zrzuty-mac/*.png

      - uses: actions/upload-artifact@v6
        with:
          name: PodpiszPdf-macOS
          path: |
            wynik/*.dmg
            wynik/*.dmg.sha256
          if-no-files-found: error

  # Wydanie z przetestowanego instalatora tego przebiegu, gdy wersja z PodpiszPdf.csproj nie ma jeszcze
  # znacznika v<wersja>. Środowisko „wydanie” wymaga zatwierdzenia przez właściciela repozytorium
  # (Settings → Environments) — dopiero wtedy zadanie dostaje klucz podpisu aktualizacji i token wydań.
  wydanie:
    needs: [build, macos]
    if: needs.build.outputs.nowa == 'tak'
    runs-on: ubuntu-latest
    environment: wydanie
    # Jedno wydanie naraz: drugi przebieg z tą samą wersją czeka, a potem zatrzymuje się na kontroli znacznika.
    concurrency:
      group: wydanie
      cancel-in-progress: false
    env:
      TOKEN_WYDANIA: ${{ secrets.TOKEN_WYDANIA }}
      KLUCZ_AKTUALIZACJI: ${{ secrets.KLUCZ_AKTUALIZACJI }}
      WERSJA: ${{ needs.build.outputs.wersja }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wersja nadal niewydana
        run: |
          kod=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/git/ref/tags/v$WERSJA")
          case "$kod" in
            404) echo "Wersja $WERSJA — nowe wydanie" ;;
            200) echo "::error::Wersja $WERSJA jest już wydana (inny przebieg). Podnieś <Version>."; exit 1 ;;
            *) echo "::error::Nie udało się sprawdzić znacznika (HTTP $kod)"; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          sparse-checkout: src/PodpiszPdf.Core/PodpisAktualizacji.cs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: PodpiszPdf
          path: wynik

      - uses: actions/download-artifact@v7
        with:
          name: PodpiszPdf-macOS
          path: wynik-mac

      - name: Kontrola plików
        run: |
          ls -la wynik wynik/* 2>/dev/null || true
          msi=$(find wynik -name PodpiszPdf.msi | head -1); sum=$(find wynik -name PodpiszPdf.msi.sha256 | head -1); cer=$(find wynik -name PodpiszPdf.cer | head -1)
          [ -n "$msi" ] && [ -n "$sum" ] && [ -n "$cer" ] || { echo "::error::Niepełny artefakt"; exit 1; }
          oczekiwana=$(cut -d' ' -f1 "$sum"); faktyczna=$(sha256sum "$msi" | cut -d' ' -f1)
          [ "$oczekiwana" = "$faktyczna" ] || { echo "::error::Suma SHA-256 instalatora się nie zgadza"; exit 1; }
          mkdir -p pliki && cp "$msi" "$sum" "$cer" pliki/
          # Wersja dla macOS: oba obrazy DMG z sumami kontrolnymi.
          for nazwa in AppleSilicon Intel; do
            dmg="wynik-mac/PodpiszPdf-macOS-$nazwa.dmg"
            [ -f "$dmg" ] && [ -f "$dmg.sha256" ] || { echo "::error::Brak obrazu $dmg"; exit 1; }
            [ "$(cut -d' ' -f1 "$dmg.sha256")" = "$(sha256sum "$dmg" | cut -d' ' -f1)" ] || { echo "::error::Suma SHA-256 $dmg się nie zgadza"; exit 1; }
            cp "$dmg" "$dmg.sha256" pliki/
          done
          ls -la pliki

      # Podpis wydania kluczem spoza GitHub Actions (sekret środowiska „wydanie”): program instaluje
      # aktualizację tylko z ważnym podpisem (PodpisAktualizacji.cs). Bez klucza nie ma wydania.
      - name: Podpis aktualizacji
        run: |
          [ -n "$KLUCZ_AKTUALIZACJI" ] || { echo "::error::Brak sekretu KLUCZ_AKTUALIZACJI w środowisku „wydanie”"; exit 1; }
          umask 077
          printf '%s\n' "$KLUCZ_AKTUALIZACJI" > "$RUNNER_TEMP/klucz.pem"
          sha=$(cut -d' ' -f1 pliki/PodpiszPdf.msi.sha256 | tr 'a-f' 'A-F')
          printf 'PodpiszPdf-aktualizacja\nwersja=%s\nplik=PodpiszPdf.msi\nsha256=%s\n' "$WERSJA" "$sha" > "$RUNNER_TEMP/wiadomosc.txt"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/klucz.pem" "$RUNNER_TEMP/wiadomosc.txt" | base64 -w0 > pliki/PodpiszPdf.msi.sig
          # Klucz musi odpowiadać jednemu z kluczy publicznych wbudowanych w program.
          publiczny=$(openssl pkey -in "$RUNNER_TEMP/klucz.pem" -pubout -outform DER | base64 -w0)
          rm -f "$RUNNER_TEMP/klucz.pem"
          grep -qF "\"$publiczny\"" src/PodpiszPdf.Core/PodpisAktualizacji.cs || { echo "::error::Klucz nie pasuje do kluczy w PodpisAktualizacji.cs"; exit 1; }
          base64 -d pliki/PodpiszPdf.msi.sig > "$RUNNER_TEMP/podpis.der"
          echo "$publiczny" | base64 -d > "$RUNNER_TEMP/publiczny.der"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/publiczny.der" -keyform DER -signature "$RUNNER_TEMP/podpis.der" "$RUNNER_TEMP/wiadomosc.txt"

      - name: Wydanie (Release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.wersja }}
          target_commitish: ${{ github.sha }}
          name: PodpiszPdf v${{ needs.build.outputs.wersja }}
          files: pliki/*
          generate_release_notes: true

      # Publiczne repozytorium wydań — stąd program pobiera aktualizacje.
      - name: Wydanie w repozytorium aktualizacji
        if: env.TOKEN_WYDANIA != ''
        uses: softprops/action-gh-release@v3
        with:
          repository: Orinoko357/PodpiszPdf-wydania
          token: ${{ secrets.TOKEN_WYDANIA }}
          tag_name: v${{ needs.build.outputs.wersja }}
          name: PodpiszPdf v${{ needs.build.outputs.wersja }}
          body: |
            Kwalifikowany podpis elektroniczny PAdES plików PDF. Pobierz i uruchom instalator **PodpiszPdf.msi**
            (Windows 10/11, 64-bit, instalacja dla całego komputera). Zainstalowany program aktualizuje się sam.
            Cicha instalacja: `msiexec /i PodpiszPdf.msi /qn`.

            Certyfikat **PodpiszPdf.cer** jest potrzebny tylko do pozycji w nowym menu kontekstowym Windows 11
            (instalator dodaje go sam).

            **macOS** (14 Sonoma lub nowszy): **PodpiszPdf-macOS-AppleSilicon.dmg** (procesory M1–M4)
            albo **PodpiszPdf-macOS-Intel.dmg**. Otwórz obraz i przeciągnij PodpiszPdf do folderu Aplikacje.
            Program nie ma jeszcze podpisu Apple: przy pierwszym uruchomieniu otwórz go prawym przyciskiem → „Otwórz”
            (albo Ustawienia systemowe → Prywatność i ochrona → „Otwórz mimo to”). Karta działa przez bibliotekę
            PKCS#11 z oprogramowania karty (np. proCertum CardManager).
          files: pliki/*

      # Sprawdzenie tak, jak robi to program: najnowsze wydanie w repozytorium aktualizacji ma instalator i sumę.
      - name: Kontrola repozytorium aktualizacji
        if: env.TOKEN_WYDANIA != ''
        run: |
          sleep 5
          curl -sf -H "Authorization: Bearer $TOKEN_WYDANIA" https://api.github.com/repos/Orinoko357/PodpiszPdf-wydania/releases/latest -o najnowsze.json
          jq -r '.tag_name, (.assets[].name)' najnowsze.json
          [ "$(jq -r .tag_name najnowsze.json)" = "v${{ needs.build.outputs.wersja }}" ] || { echo "::error::Najnowsze wydanie w repozytorium aktualizacji to nie v${{ needs.build.outputs.wersja }}"; exit 1; }
          jq -e '[.assets[].name] | index("PodpiszPdf.msi") and index("PodpiszPdf.msi.sha256") and index("PodpiszPdf.msi.sig")' najnowsze.json > /dev/null || { echo "::error::Brak instalatora, sumy lub podpisu"; exit 1; }
