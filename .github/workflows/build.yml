name: Build

# Jeden przebieg na commit: wynik budowania z „push” jest widoczny także w pull requeście
# (osobny przebieg dla pull_request dublował maile o błędach).
on:
  push:
  workflow_dispatch:
    inputs:
      wersja:
        description: "Numer wydania do opublikowania, np. 1.0.0.1 (puste = tylko budowanie)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      # Sekrety repozytorium (opcjonalne — bez nich program buduje się, ale bez pakietu menu Windows 11
      # i bez publikacji w repozytorium wydań, z którego program pobiera aktualizacje).
      CERTYFIKAT_PFX: ${{ secrets.CERTYFIKAT_PFX }}
      TOKEN_WYDANIA: ${{ secrets.TOKEN_WYDANIA }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # --blame: przy awarii procesu testów pokazuje, który test był wtedy wykonywany.
      - name: Testy
        run: dotnet test tests/PodpisPdf.Tests -c Release --blame

      # Pakiet „z zawartością zewnętrzną” dla nowego menu kontekstowego Windows 11, podpisany certyfikatem
      # CN=PodpisPdf (sekret CERTYFIKAT_PFX). Bez sekretu: certyfikat tymczasowy — pakiet tylko do testu
      # poniżej, nie trafia do PodpisPdf.exe.
      - name: Pakiet menu Windows 11
        shell: pwsh
        run: |
          $wersja = ([xml](Get-Content src/PodpisPdf/PodpisPdf.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $bin = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).DirectoryName
          "Wersja pakietu: $wersja, narzędzia: $bin"
          New-Item -ItemType Directory -Force pakiet/budowa, pakiet/wynik | Out-Null
          Copy-Item pakiet/Assets pakiet/budowa -Recurse -Force
          (Get-Content pakiet/AppxManifest.xml -Raw).Replace('WERSJA', $wersja) | Set-Content pakiet/budowa/AppxManifest.xml -Encoding utf8
          & "$bin\makeappx.exe" pack /d pakiet/budowa /p pakiet/wynik/PodpisPdf.msix /nv /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx: $LASTEXITCODE" }
          $haslo = 'PodpisPdf'
          if ($env:CERTYFIKAT_PFX) {
            [IO.File]::WriteAllBytes("$PWD/pakiet/cert.pfx", [Convert]::FromBase64String($env:CERTYFIKAT_PFX))
          } else {
            "::warning::Brak sekretu CERTYFIKAT_PFX — pakiet menu Windows 11 podpisany certyfikatem tymczasowym, tylko do testu."
            $c = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=PodpisPdf' -CertStoreLocation Cert:\CurrentUser\My -KeyExportPolicy Exportable
            Export-PfxCertificate -Cert $c -FilePath pakiet/cert.pfx -Password (ConvertTo-SecureString $haslo -AsPlainText -Force) | Out-Null
          }
          & "$bin\signtool.exe" sign /fd SHA256 /f pakiet/cert.pfx /p $haslo pakiet/wynik/PodpisPdf.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool: $LASTEXITCODE" }
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new("$PWD/pakiet/cert.pfx", $haslo)
          [IO.File]::WriteAllBytes("$PWD/pakiet/wynik/PodpisPdf.cer", $cert.Export('Cert'))
          "Certyfikat: $($cert.Subject), odcisk $($cert.Thumbprint), ważny do $($cert.NotAfter)"
          Remove-Item pakiet/cert.pfx
          if (-not $env:CERTYFIKAT_PFX) { Move-Item pakiet/wynik pakiet/test }

      - name: Publikacja PodpisPdf.exe
        run: dotnet publish src/PodpisPdf -c Release -r win-x64 -p:Platform=x64 -o publish

      - name: Test uruchomienia PodpisPdf.exe (i czas startu)
        shell: pwsh
        run: |
          foreach ($proba in 1..2) {
            $czas = Measure-Command {
              $p = Start-Process publish/PodpisPdf.exe -ArgumentList '--sprawdz' -PassThru
              if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "PodpisPdf.exe --sprawdz nie zakończył się w 3 minuty" }
            }
            if ($p.ExitCode -ne 0) {
              Get-Content "$env:TEMP/PodpisPdf-blad.txt" -ErrorAction SilentlyContinue
              Get-WinEvent -LogName Application -MaxEvents 20 -ErrorAction SilentlyContinue |
                Where-Object { $_.ProviderName -match 'Application Error|\.NET Runtime' } | Format-List TimeCreated, Message
              throw "PodpisPdf.exe --sprawdz zakończył się kodem $($p.ExitCode)"
            }
            "Uruchomienie $proba`: $([math]::Round($czas.TotalSeconds, 2)) s"
          }
          "Rozmiar: $([math]::Round((Get-Item publish/PodpisPdf.exe).Length / 1MB, 1)) MB"

      # Rejestracja pakietu z PodpisPdf.exe w osobnym folderze (jak %APPDATA%\PodpisPdf): start programu
      # z tożsamością pakietu i aktywacja serwera COM polecenia menu (tak robi to Eksplorator Windows 11).
      - name: Test pakietu menu Windows 11
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'PodpisPdf-pakiet'
          New-Item -ItemType Directory -Force $folder | Out-Null
          Copy-Item publish/PodpisPdf.exe $folder
          $zrodlo = if (Test-Path pakiet/wynik/PodpisPdf.msix) { 'pakiet/wynik' } else { 'pakiet/test' }
          certutil -addstore TrustedPeople "$zrodlo/PodpisPdf.cer" | Out-Null
          Add-AppxPackage -Path "$zrodlo/PodpisPdf.msix" -ExternalLocation $folder
          Get-AppxPackage PodpisPdf | Format-List Name, Version, PackageFullName
          Remove-Item "$env:TEMP/PodpisPdf-sprawdz.txt" -ErrorAction SilentlyContinue
          $p = Start-Process "$folder/PodpisPdf.exe" -ArgumentList '--sprawdz' -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Start z folderu pakietu: brak zakończenia" }
          Get-Content "$env:TEMP/PodpisPdf-sprawdz.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Get-Content "$env:TEMP/PodpisPdf-blad.txt" -ErrorAction SilentlyContinue; throw "Start z folderu pakietu: kod $($p.ExitCode)" }
          $obiekt = [Activator]::CreateInstance([Type]::GetTypeFromCLSID([Guid]'6E2F4C3A-8B1D-4F5E-9A7C-2D3B4E5F6A71'))
          if ($null -eq $obiekt) { throw "Serwer COM menu nie odpowiada" }
          "Serwer COM menu Windows 11: działa"
          [Runtime.InteropServices.Marshal]::ReleaseComObject($obiekt) | Out-Null
          Get-Process PodpisPdf -ErrorAction SilentlyContinue | Stop-Process -Force
          Get-AppxPackage PodpisPdf | Remove-AppxPackage

      - name: Zrzuty ekranu (jasny i ciemny motyw)
        shell: pwsh
        run: |
          Remove-Item "$env:TEMP/PodpisPdf-blad.txt" -ErrorAction SilentlyContinue
          $p = Start-Process publish/PodpisPdf.exe -ArgumentList '--zrzuty', "$PWD/zrzuty" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); throw "Zrzuty ekranu: brak zakończenia w 5 minut" }
          Get-Content "$env:TEMP/PodpisPdf-blad.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Get-WinEvent -LogName Application -MaxEvents 20 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'Application Error|\.NET Runtime' } | Format-List TimeCreated, Message
            throw "Zrzuty ekranu: kod $($p.ExitCode)"
          }

      # Zrzuty na osobnej gałęzi „zrzuty-ekranu” (do obejrzenia bez pobierania artefaktu).
      - name: Zrzuty ekranu na gałąź zrzuty-ekranu
        shell: pwsh
        run: |
          $zrodlo = "${{ github.sha }}".Substring(0, 7)
          New-Item -ItemType Directory -Force -Path ../zrzuty-galaz | Out-Null
          Copy-Item zrzuty/*.png ../zrzuty-galaz/
          Set-Location ../zrzuty-galaz
          git init -q -b zrzuty-ekranu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.png
          git commit -q -m "Zrzuty ekranu z $zrodlo (${{ github.ref_name }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" zrzuty-ekranu

      - uses: actions/upload-artifact@v6
        with:
          name: Zrzuty-ekranu
          path: zrzuty/*.png

      - name: Suma kontrolna SHA-256
        shell: pwsh
        run: |
          $suma = (Get-FileHash publish/PodpisPdf.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content publish/PodpisPdf.exe.sha256 "$suma  PodpisPdf.exe" -NoNewline -Encoding ascii
          "SHA-256: $suma"

      - uses: actions/upload-artifact@v6
        with:
          name: PodpisPdf
          path: |
            publish/PodpisPdf.exe
            publish/PodpisPdf.exe.sha256

      # Wydanie (Release) z plikiem PodpisPdf.exe: po wypchnięciu znacznika vX.Y.Z.W
      # albo po ręcznym uruchomieniu workflow z podanym numerem wersji (znacznik powstaje wtedy automatycznie).
      - name: Wydanie (Release)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.wersja != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.wersja != '' && format('v{0}', inputs.wersja) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: PodpisPdf ${{ inputs.wersja != '' && format('v{0}', inputs.wersja) || github.ref_name }}
          files: |
            publish/PodpisPdf.exe
            publish/PodpisPdf.exe.sha256
            pakiet/wynik/PodpisPdf.cer
          fail_on_unmatched_files: false
          generate_release_notes: true

      # Publiczne repozytorium wydań — stąd program pobiera aktualizacje (sekret TOKEN_WYDANIA:
      # token z prawem zapisu do Orinoko357/PodpisPdf-wydania).
      - name: Wydanie w repozytorium aktualizacji
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.wersja != '') && env.TOKEN_WYDANIA != ''
        uses: softprops/action-gh-release@v3
        with:
          repository: Orinoko357/PodpisPdf-wydania
          token: ${{ secrets.TOKEN_WYDANIA }}
          tag_name: ${{ inputs.wersja != '' && format('v{0}', inputs.wersja) || github.ref_name }}
          name: PodpisPdf ${{ inputs.wersja != '' && format('v{0}', inputs.wersja) || github.ref_name }}
          body: |
            Kwalifikowany podpis elektroniczny PAdES plików PDF. Pobierz **PodpisPdf.exe** i uruchom
            (Windows 10/11, 64-bit). Zainstalowany program aktualizuje się sam.

            Certyfikat **PodpisPdf.cer** jest potrzebny tylko do pozycji w nowym menu kontekstowym Windows 11.
          files: |
            publish/PodpisPdf.exe
            publish/PodpisPdf.exe.sha256
            pakiet/wynik/PodpisPdf.cer
          fail_on_unmatched_files: false
